<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>신양2리 스마트 안내 시연</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#17407F; --muted:#4F6C94; --line:#BFDCF5; --accent:#2F8FEA; --chip:#DDEEFF;
  --ok:#1E9E5A; --off:#8896A6; --soon:#E58A1F; --info:#2F8FEA; --warn:#D64545;
  --display:'Jua','Noto Sans KR',sans-serif; --body:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#cfe3ea;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#cfe3ea}
#map{position:absolute;inset:0;z-index:0}
#ui{position:absolute;inset:0;z-index:1200;pointer-events:none}
#ui>*{pointer-events:auto}
p{margin:0}
.mkwrap{background:none;border:0}
.mk{position:relative;width:24px;height:24px;border-radius:50%;border:3px solid #fff;background:var(--info);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.mk.open{background:var(--ok)}.mk.closed{background:var(--off)}.mk.soon{background:var(--soon)}
.mk.big{width:36px;height:36px;border-width:4px}
.ml{position:absolute;left:50%;top:42px;transform:translateX(-50%);font:700 13px var(--body);white-space:nowrap;background:#fff;color:var(--ink);padding:2px 9px;border-radius:8px;border:2px solid var(--accent)}
/* 상단 */
.topwrap{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none!important}
.topwrap>*{pointer-events:auto}
.searchbar{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #fff;border-radius:16px;padding:0 12px;height:50px;box-shadow:0 3px 0 rgba(20,57,110,.25),0 6px 14px rgba(20,90,170,.25)}
.searchbar svg{width:20px;height:20px;flex:none;color:var(--muted)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;color:var(--ink);background:none}
.searchbar input::placeholder{color:#7E93AD}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{font-family:var(--display);font-size:15px;background:#fff;color:var(--ink);border:2px solid #fff;border-radius:999px;padding:6px 14px;box-shadow:0 3px 0 rgba(20,57,110,.22);display:inline-flex;gap:6px;align-items:center;white-space:nowrap;flex:none}
button.pill{cursor:pointer}
.pill.on{background:var(--accent);color:#fff}
/* 하단 시트 */
#sheetwrap{position:absolute;left:0;right:0;bottom:0}
.sheet{position:relative;max-height:56vh;overflow:auto;background:linear-gradient(180deg,#F6FBFF,#E2F2FF);border-top:3px solid #fff;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(20,90,170,.3);padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.grab{width:40px;height:4px;border-radius:2px;background:#9CCBF2;margin:0 auto 2px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>div{min-width:0}
.between{justify-content:space-between}
.lt{font-family:var(--display);font-size:22px;line-height:1.3}
.small{font-size:13px;color:var(--muted)}
.muted{font-size:15px;color:var(--muted)}
.card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid #9CCBF2;border-radius:16px;box-shadow:0 3px 0 #9CCBF2;padding:11px 12px;cursor:pointer}
.card:active{transform:translateY(2px);box-shadow:0 1px 0 #9CCBF2}
.cinfo{display:flex;flex-direction:column;min-width:0;flex:1}
.cinfo b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1.3}
.cinfo span{font-size:13.5px;color:var(--muted);line-height:1.4}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--info)}
.dot.open{background:var(--ok)}.dot.closed{background:var(--off)}.dot.soon{background:var(--soon)}
.chip{font-size:13.5px;font-weight:700;background:var(--chip);color:#3F6FA8;padding:3px 11px;border-radius:999px;white-space:nowrap;flex:none}
.chip.open{background:var(--ok);color:#fff}.chip.closed{background:var(--off);color:#fff}.chip.soon{background:var(--soon);color:#fff}
.chip.kid{background:#FFE9C8;color:#9A5A00}
.sname{font-family:var(--display);font-size:24px;line-height:1.25}
.kv{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:15px}
.kv span{color:var(--muted);font-weight:700;font-size:14px}
.btns{display:grid;grid-template-columns:1fr;gap:8px}
.btn{font-family:var(--display);font-size:19px;border:0;border-radius:16px;padding:13px;background:var(--accent);color:#fff;box-shadow:0 4px 0 #1A62B3;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1A62B3}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid #9CCBF2;box-shadow:0 4px 0 #9CCBF2}
.btn.hot{background:#FF8A2B;box-shadow:0 4px 0 #C95F0F}
.btn:disabled{opacity:.6}
.more{font:inherit;font-size:15px;font-weight:700;color:#1A62B3;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #FF8A2B;outline-offset:2px}
.box{border:2px solid #BFDCF5;border-radius:16px;padding:10px 12px;background:#fff}
.note{font-size:13.5px;color:var(--muted);background:var(--chip);border-radius:12px;padding:9px 12px}
.osm{font-size:11px;color:var(--muted);text-decoration:none;align-self:flex-end}
.steps{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.steps li span{color:var(--muted)}
.gpsl{white-space:pre-line}
.me{position:relative;width:56px;height:56px}
.me i{position:absolute;display:block}
.me-halo{left:8px;top:8px;width:40px;height:40px;border-radius:50%;background:rgba(47,127,240,.22)}
.me-dot{left:19px;top:19px;width:18px;height:18px;border-radius:50%;background:#1F6FF0;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.me-rot{left:0;top:0;width:56px;height:56px;transform-origin:28px 28px;opacity:0;transition:transform .25s linear}
.me-rot.on{opacity:1}
.me-rot::before{content:"";position:absolute;left:21px;top:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:13px solid #1F6FF0;filter:drop-shadow(0 0 1px #fff)}
.fab{position:absolute;right:14px;top:-60px;width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:0 3px 0 rgba(20,57,110,.25),0 6px 12px rgba(20,90,170,.25);cursor:pointer;padding:0;z-index:2}
.fab svg{width:25px;height:25px}
.fab.on{background:var(--accent);color:#fff}
.fab.wait svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 홈 */
.home{position:absolute;inset:0;background:linear-gradient(180deg,#8FD6FF 0,#C9EAFF 200px,#F2FAFF 100%);overflow:auto;padding:max(12px,env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;padding:2px 0 0}
.htitle{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.2;margin:0;color:#FFD84A;-webkit-text-stroke:6px #17407F;paint-order:stroke fill;text-shadow:0 4px 0 #17407F}
.hsub{margin:10px 0 0;color:#17407F;font-weight:700;font-size:16px}
.today{background:#fff;border:3px solid #9CCBF2;border-radius:20px;box-shadow:0 4px 0 #9CCBF2;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.today.bad{border-color:var(--warn);box-shadow:0 4px 0 var(--warn);background:#FFF5F3}
.today h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.trow{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.45}
.tic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--chip);display:grid;place-items:center}
.tic svg{width:18px;height:18px}
.today.bad .tic{background:#FFE0DB}
.trow b{display:block}
.trow span{color:var(--muted);font-size:14px}
.opennow{font:inherit;color:inherit;text-align:left;cursor:pointer;background:#E8F8EF;border:3px solid #7ED3A5;border-radius:20px;box-shadow:0 4px 0 #7ED3A5;padding:12px 14px;display:flex;align-items:center;gap:12px}
.opennow:active{transform:translateY(3px);box-shadow:0 1px 0 #7ED3A5}
.opennow .big{font-family:var(--display);font-size:22px;line-height:1.3}
.opennow .num{margin-left:auto;font-family:var(--display);font-size:34px;color:var(--ok)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{font:inherit;color:inherit;text-align:left;background:#fff;border:3px solid var(--cc);border-radius:20px;box-shadow:0 4px 0 var(--cc);padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cc)}
.cat-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--cc);color:#fff}
.cat-ic svg{width:28px;height:28px}
.cat-nm{font-family:var(--display);font-size:20px;line-height:1.25}
.cat-ct{font-size:13.5px;color:var(--muted)}
.cat.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px}
.panel{position:absolute;z-index:3000;inset:0;background:linear-gradient(180deg,#9AD8FF 0,#D6EEFF 160px,#F2FAFF 100%);overflow:auto;padding:max(14px,env(safe-area-inset-top,0px)) 16px 28px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.25;margin:0;color:#FFD84A;-webkit-text-stroke:5px #17407F;paint-order:stroke fill;text-shadow:0 3px 0 #17407F;text-align:center}
.panel .head{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.04em}
.owner{background:#fff;border:3px solid #9CCBF2;border-radius:20px;box-shadow:0 4px 0 #9CCBF2;padding:14px;display:flex;flex-direction:column;gap:10px}
.owner b{font-family:var(--display);font-weight:400;font-size:21px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{font-family:var(--display);font-size:22px;padding:18px 8px;border-radius:16px;border:3px solid #BFDCF5;background:#F4FAFF;color:var(--ink);cursor:pointer}
.seg button.sel.open{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.closed{background:var(--off);border-color:var(--off);color:#fff}
.seg button.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.bad{background:var(--warn);border-color:var(--warn);color:#fff}
/* 소개 */
.intro{position:absolute;inset:0;background:linear-gradient(180deg,#8FD6FF 0,#3B9BE8 55%,#1F66C4 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:32px 24px calc(28px + env(safe-area-inset-bottom,0px))}
.intro.center{align-items:center;text-align:center}
.intro .btn.ghost{background:rgba(255,255,255,.2);color:#fff;border:2px solid rgba(255,255,255,.7);box-shadow:none}
.tag2{font-size:13px;font-weight:700;letter-spacing:.06em;color:#fff;text-shadow:0 1px 0 #17407F}
.ibig{font-family:var(--display);font-weight:400;font-size:29px;line-height:1.3;margin:0;color:#fff;text-shadow:0 3px 0 #17407F}
.logo{font-family:var(--display);font-size:40px;line-height:1.2;color:#FFD84A;-webkit-text-stroke:6px #17407F;paint-order:stroke fill;text-shadow:0 4px 0 #17407F}
.sm{font-size:15px;opacity:.95;margin:0}
.ringwrap{display:grid;place-items:center;padding:12px 0}
.ring2{position:relative;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;font-weight:700;letter-spacing:.04em;font-size:18px}
.ring2::before,.ring2::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #FFD84A;opacity:0}
.ring2.go::before{animation:pulse2 1.1s ease-out infinite}
.ring2.go::after{animation:pulse2 1.1s ease-out .35s infinite}
@keyframes pulse2{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.bar{width:160px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#FFD84A;animation:loadbar 1.3s linear forwards}
@keyframes loadbar{to{width:100%}}
.slidebox{display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff;margin:0 auto}
.slidebox svg{width:80px;height:80px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.skip{position:absolute;right:16px;top:max(14px,env(safe-area-inset-top,0px));background:none;border:0;color:#fff;opacity:.9;font:inherit;font-size:15px;cursor:pointer}

/* 기념샷 사진첩 */
.sprite{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.sprite.lock{filter:brightness(0);opacity:.22}
.feat{font:inherit;color:inherit;text-align:left;cursor:pointer;background:linear-gradient(135deg,#FFF3D6,#FFE2A8);border:3px solid #FFB84A;border-radius:20px;box-shadow:0 4px 0 #FFB84A;padding:10px 14px;display:flex;align-items:center;gap:12px}
.feat:active{transform:translateY(3px);box-shadow:0 1px 0 #FFB84A}
.feat .fi{width:64px;height:48px;flex:none}
.feat .ft{font-family:var(--display);font-size:20px;line-height:1.3}
.feat .fp{margin-left:auto;font-family:var(--display);font-size:22px;color:#C95F0F;white-space:nowrap}
.albc{font:inherit;color:inherit;text-align:left;cursor:pointer;background:#fff;border:3px solid #9CCBF2;border-radius:20px;box-shadow:0 4px 0 #9CCBF2;padding:10px 14px;display:flex;align-items:center;gap:12px}
.albc:active{transform:translateY(3px);box-shadow:0 1px 0 #9CCBF2}
.albc .big{font-family:var(--display);font-size:20px;line-height:1.3}
.albc .num{margin-left:auto;font-family:var(--display);font-size:24px;color:#C95F0F;white-space:nowrap}
.minis{display:flex;gap:4px;flex:none}
.minis i{display:block;width:22px;height:22px;border-radius:6px;background:#E3F1FF;border:2px solid #BFDCF5;padding:1px}
.minis i.on{background:#FFE9A8;border-color:#FFB84A}
.cert{border:3px dashed #FFB84A;border-radius:18px;background:#FFF8E8;padding:12px;display:flex;flex-direction:column;gap:8px}
.cert.done{border-style:solid;border-color:var(--ok);background:#EDFAF2}
.cert b{font-family:var(--display);font-weight:400;font-size:19px}
.cert .crow{display:flex;gap:12px;align-items:center}
.cert .cm{width:72px;height:72px;flex:none;background:#fff;border-radius:14px;border:2px solid #FFD58A;padding:4px}
.thumb{width:72px;height:72px;flex:none;border-radius:14px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);position:relative;background:#fff}
.thumb img.ph{width:100%;height:100%;object-fit:cover;display:block}
.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{cursor:pointer}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot{background:#fff;border:3px solid #BFDCF5;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.slot.got{border-color:#FFB84A;background:#FFF8E8;box-shadow:0 3px 0 #FFB84A}
.slot .sp{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;background:#EAF5FF;overflow:hidden;display:grid;place-items:center}
.slot .sp img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .sp .bd{position:absolute;right:4px;bottom:4px;width:44px;height:44px;background:#fff;border-radius:50%;border:2px solid #FFB84A;padding:4px}
.slot .sp .big0{width:70%;height:70%}
.slot b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.25}
.slot span.s2{font-size:12.5px;color:var(--muted)}
.pts{background:#fff;border:3px solid #FFB84A;border-radius:20px;box-shadow:0 4px 0 #FFB84A;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pts .pn{font-family:var(--display);font-size:34px;color:#C95F0F;line-height:1.1}
.bonus{background:#FFE9A8;border-radius:14px;padding:9px 12px;font-weight:700;font-size:14.5px}
.rq{background:#FFF8E8;border:3px solid #FFB84A;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.bigok{font-family:var(--display);font-size:30px;color:var(--ok);text-align:center}


/* ===== 정보 앱 스타일 ===== */
:root{--ink:#191F28;--muted:#6B7684;--line:#E5E8EB;--accent:#2563EB;--chip:#EEF2F6;--ok:#12A150;--warn:#E5483B;--soon:#E08A00;--display:'Noto Sans KR',system-ui,sans-serif;--tab:62px}
body,#app{background:#F2F4F6}
body{font-size:16px}
.mk{border-width:2.5px}
/* 공통 */
.btn{font-family:var(--body);font-weight:700;font-size:17px;border-radius:14px;padding:0 14px;min-height:52px;line-height:52px;background:var(--accent);color:#fff;box-shadow:none}
.btn:active{transform:none;opacity:.85;box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.hot{background:var(--accent);box-shadow:none}
.btn:disabled{opacity:.4}
label.btn{display:block}
.pill{font-family:var(--body);font-weight:700;font-size:14px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:8px 14px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pill.on{background:var(--accent);color:#fff}
.chip{font-weight:700;font-size:12.5px;background:var(--chip);color:#4E5968;padding:3px 10px;border-radius:8px}
.chip.open{background:#E3F6EC;color:#0B7A3E}.chip.closed{background:#EEF0F3;color:#6B7684}.chip.soon{background:#FFF1D6;color:#9A5A00}.chip.kid{background:#E8F0FF;color:#1D4FBF}
.dot.open{background:var(--ok)}.dot.soon{background:var(--soon)}
.more{color:var(--accent)}
.note{background:#F2F4F6;border-radius:12px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:14px}
/* 하단 탭 */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:var(--tab);z-index:4000;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box}
.tb{font:inherit;background:none;border:0;color:#8B95A1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;cursor:pointer}
.tb svg{width:25px;height:25px}
.tb.on{color:var(--accent)}
/* 홈 */
.home{background:#F2F4F6;gap:12px;padding:max(14px,env(safe-area-inset-top,0px)) 16px calc(var(--tab) + 24px + env(safe-area-inset-bottom,0px));bottom:0}
.appbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ab-t{font-size:24px;font-weight:700;letter-spacing:-.02em}
.ab-s{font-size:13.5px;color:var(--muted)}
.gpsbtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--accent);background:#fff;border:0;border-radius:999px;padding:8px 13px;box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer;flex:none}
.gpsbtn.on{background:var(--accent);color:#fff}
.fsearch{font:inherit;display:flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:14px;height:50px;padding:0 14px;color:#8B95A1;font-size:16px;text-align:left;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.fsearch svg{width:20px;height:20px;flex:none}
.stat{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

function hav(a,b){var R=6371000,r=Math.PI/180,dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r,x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)*Math.sin(dLo/2);return 2*R*Math.asin(Math.sqrt(x));}

var watchId=null,hadFix=false,simRaf=null;
var meIcon=L.divIcon({className:'mkwrap',html:'<div class="me"><i class="me-halo"></i><i class="me-rot"></i><i class="me-dot"></i></div>',iconSize:[56,56],iconAnchor:[28,28]});
function gpsText(i){
  if(!S.meLL)return '내 위치를 찾는 중이에요…';
  var d=hav(S.meLL,P[i].ll);
  var t=d<10?'이곳과 거의 같은 위치예요':'내 위치에서 '+fmtD(d)+' · '+bearing(S.meLL,P[i].ll)+'쪽';
  if(S.acc)t+=' · 위치 오차 약 '+Math.round(S.acc)+'m';
  return t;
}
function updateGps(){var el=document.getElementById('gpsline');if(el)el.textContent=gpsText(S.sel);}
function onPos(pos){
  var ll=[pos.coords.latitude,pos.coords.longitude],first=!hadFix,hadMsg=!!S.gps;
  var hd=pos.coords.heading;
  if(!(typeof hd==='number'&&!isNaN(hd))){hd=null;if(S.meLL&&hav(S.meLL,ll)>2)hd=bdeg(S.meLL,ll);}
  if(hd!==null)S.heading=hd;
  hadFix=true;S.meLL=ll;S.acc=pos.coords.accuracy||0;S.gps='';
  if(!meMarker){meMarker=L.marker(ll,{icon:meIcon,interactive:false,zIndexOffset:900}).addTo(map);}else{meMarker.setLatLng(ll);}
  var el=meMarker.getElement&&meMarker.getElement(),rot=el&&el.querySelector('.me-rot');
  if(rot&&typeof S.heading==='number'){rot.classList.add('on');rot.style.transform='rotate('+Math.round(S.heading)+'deg)';}
  if(!accCircle){accCircle=L.circle(ll,{radius:S.acc,color:'#2F7FF0',weight:1,fillOpacity:.12,interactive:false}).addTo(map);}else{accCircle.setLatLng(ll);accCircle.setRadius(S.acc);}
  if(first&&S.view!=='home'){map.setView(ll,16,{animate:false});map.panBy([0,120],{animate:false});}
  if(first||hadMsg)render();else updateGps();
}
function onPosErr(err){
  var c=err&&err.code;
  S.gps=c===1?'위치 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요':(c===3?'위치를 찾는 데 시간이 걸려요':'위치를 가져오지 못했어요');
  if(c===1)stopTrack(true);
  render();
}
function startTrack(){
  if(!navigator.geolocation){S.gps='이 기기는 위치를 지원하지 않아요';render();return;}
  if(watchId!==null)return;
  S.tracking=true;S.gps='위치 찾는 중…';render();
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
function stopTrack(silent){
  if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);}
  cancelWalk();watchId=null;S.tracking=false;S.simOn=false;hadFix=false;S.meLL=null;S.acc=0;S.heading=null;
  if(meMarker){map.removeLayer(meMarker);meMarker=null;}
  if(accCircle){map.removeLayer(accCircle);accCircle=null;}
  if(!silent){S.gps='';render();}
}
function cancelWalk(){if(simRaf){cancelAnimationFrame(simRaf);simRaf=null;}S.walking=false;}
function simStart(){
  stopTrack(true);S.simOn=true;S.tracking=true;S.gps='';hadFix=false;
  onPos({coords:{latitude:A[0]+0.00012,longitude:A[1]-0.00008,accuracy:6}});
}
function simWalk(){
  var r=S.route;if(!r||r.to!==S.sel||!r.pts||r.pts.length<2||!S.simOn)return;
  cancelWalk();
  var pts=r.pts,cum=[0];for(var k=1;k<pts.length;k++)cum.push(cum[k-1]+hav(pts[k-1],pts[k]));
  var total=cum[cum.length-1]||1,dur=Math.min(10000,Math.max(5000,total*8)),t0=null;
  S.walking=true;render();
  function pt(d){var k=1;while(k<cum.length-1&&cum[k]<d)k++;var f=(d-cum[k-1])/((cum[k]-cum[k-1])||1);f=Math.max(0,Math.min(1,f));return [pts[k-1][0]+(pts[k][0]-pts[k-1][0])*f,pts[k-1][1]+(pts[k][1]-pts[k-1][1])*f];}
  function step(ts){
    if(!S.walking)return;if(t0===null)t0=ts;
    var f=Math.min(1,(ts-t0)/dur),ll=pt(total*f);
    onPos({coords:{latitude:ll[0],longitude:ll[1],accuracy:6}});
    map.panTo(ll,{animate:false});map.panBy([0,120],{animate:false});
    if(f<1){simRaf=requestAnimationFrame(step);}else{S.walking=false;simRaf=null;render();}
  }
  simRaf=requestAnimationFrame(step);
}
function simUi(i){
  if(!S.simOn)return '';

  if(r&&r.to===i&&r.pts)return '<button class="btn" data-act="walk">시연: 걷기 시작</button>';
  return '<p class="muted">길찾기를 누르면 가족 여행객이 그 길을 걷는 모습을 볼 수 있어요.</p>';
}

  else if(a==='home'){goHome();return;}
  else if(a==='cat'){openCat(parseInt(t.getAttribute('data-c'),10));return;}
  else if(a==='panel'){S.panel=t.getAttribute('data-t');}
  else if(a==='set'){B.setStatus(S.pin,i,t.getAttribute('data-v')).then(sync).catch(fail);return;}
  else if(a==='ferry'){var cn=t.getAttribute('data-v')==='cancel';B.setFerry(S.pin,cn,cn?2.5:0.8,cn?12:4).then(sync).catch(fail);return;}
  else if(a==='pin'){var pe=document.getElementById('pin');B.checkPin(pe?pe.value:'').then(function(ok){if(ok){S.pin=pe.value;S.ownerOk=true;sync();}else showMsg('PIN이 맞지 않아요');}).catch(fail);return;}
  else if(a==='owner-out'){S.ownerOk=false;S.pin='';}
  else if(a==='reset'){B.reset(S.pin).then(sync).catch(fail);return;}
  else if(a==='confirm'){B.confirm(S.pin,t.getAttribute('data-id')).then(function(){showMsg('사용 처리했어요');return sync();}).catch(fail);return;}
  else if(a==='checkin'){B.checkin(5).then(function(n){showMsg(n?'혜택 '+n+'장이 열렸어요':'이미 받았거나 결항이 아니에요');S.panel='album';return sync();}).catch(fail);return;}
  else if(a==='cuse'){var cid=t.getAttribute('data-id'),cc=S.coupons.filter(function(x){return x.id===cid;})[0];if(cc){B.requestUse(cid,KIND[cc.kind].shop).then(sync).catch(fail);}return;}
  else if(a==='gps'){if(S.tracking)stopTrack();else startTrack();return;}
  else if(a==='locate'){if(S.tracking&&S.meLL){map.setView(S.meLL,Math.max(map.getZoom(),16),{animate:false});map.panBy([0,120],{animate:false});}else if(!S.tracking){startTrack();}return;}
  else if(a==='center'){if(S.meLL){map.setView(S.meLL,17,{animate:false});map.panBy([0,120],{animate:false});}return;}
  else if(a==='route'){startRoute();return;}
  else if(a==='walk'){simWalk();return;}
  else if(a==='intro-tag'){
    if(S.introTag)return;S.introTag=true;render();
    setTimeout(function(){S.introTag=false;S.intro=1;render();setTimeout(function(){if(S.intro===1){S.intro=2;S.slide=0;render();}},1400);},1100);
    return;
  }
  else if(a==='intro-next'){if(S.slide<2){S.slide++;}else{S.intro=3;}}
  else if(a==='intro-allow'){S.intro=-1;render();startTrack();return;}
  else if(a==='intro-sim'){S.intro=-1;render();simStart();return;}
  else if(a==='intro-skip'){S.intro=-1;render();autoLocate();return;}
  else if(a==='tab-home'){S.panel='';goHome();return;}
  else if(a==='tab-map'){S.panel='';openCat(-3);return;}
  else if(a==='tab-alb'){S.panel='album';}
  else if(a==='tab-att'){S.panel='';openCat(-5);return;}
  else if(a==='tag'){S.tagged[i]=true;}
  else if(a==='shot'){S.got[i]=true;}
  else if(a==='albsel'){S.panel='';select(i);return;}
  else if(a==='restart'){S.got={};S.photos={};S.tagged={};S.panel='';S.route=null;S.sel=0;S.view='home';S.cat=-1;S.q='';S.intro=0;S.slide=0;stopTrack(true);}
  render();
});
ui.addEventListener('change',function(e){
  var t=e.target;if(!t||t.id!=='cam-i'||!t.files||!t.files[0])return;
  var i=parseInt(t.getAttribute('data-i'),10);
  resizeShot(t.files[0],function(url){if(url)S.photos[i]=url;S.got[i]=true;render();});
});
ui.addEventListener('input',function(e){
  if(e.target&&e.target.id==='q'){
    S.q=e.target.value;
    if(S.view==='detail'&&S.q.trim()){S.view='list';S.route=null;cancelWalk();}
    refreshList();
    var m=matches();if(m.length)fitIds(m);
  }
});

/* ---------- 시작: ?spot=N 이면 그 시설 안내가 바로 열림(NFC·QR), ?skip=1 이면 소개 없이 시작 ---------- */
var n=NaN,sk=null;
try{var qs=new URLSearchParams(location.search);n=parseInt(qs.get('spot'),10);sk=qs.get('skip');}catch(e){}
if((n>=1&&n<=P.length)||sk==='1')S.intro=-1;
if(n>=1&&n<=P.length){S.sel=n-1;S.cat=P[n-1].cat;S.view='detail';S.tagged[n-1]=true;try{history.replaceState(null,'',location.pathname);}catch(e){}}
render();
if(n>=1&&n<=P.length)focusSpot(n-1);
if(S.intro<0)startTrack();
B.onChange(sync);sync();setInterval(sync,20000);
</script>
</body>
</html>
